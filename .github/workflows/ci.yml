name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-must-fail-on-a-vulnerable-image:
    # Negative control: a scanner that never fails proves nothing. This old image must trip the gate.
    runs-on: ubuntu-latest
    steps:
      - name: Scan an old, known-vulnerable image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: alpine:3.12
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: The gate must have failed
        if: steps.scan.outcome != 'failure'
        run: |
          echo "the vulnerability gate passed an image it should have rejected" >&2
          exit 1

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: GitHub issues the job an OIDC token
    outputs:
      image: ${{ steps.names.outputs.image }}
      signed_digest: ${{ steps.push-signed.outputs.digest }}
      unsigned_digest: ${{ steps.push-unsigned.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Image names (GHCR paths must be lowercase)
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          push: false
          provenance: false
          build-args: APP_VERSION=signed
          tags: ${{ steps.names.outputs.image }}:scan

      - name: Gate - fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Everything below runs only on main / manual runs: pull requests build and scan but never publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image that will be signed
        id: push-signed
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          provenance: false
          build-args: APP_VERSION=signed
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}

      - name: Push a second image that is deliberately NOT signed
        id: push-unsigned
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          provenance: false
          build-args: APP_VERSION=unsigned
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}-unsigned

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2 # there is no floating v4 tag
        with:
          # Pinned to cosign 2.x on purpose: cosign 3 writes signatures in the new Sigstore bundle format, which
          # the pinned Kyverno (1.14) does not look for. It only finds the classic <digest>.sig tag.
          cosign-release: v2.6.5

      - name: Generate an SBOM for the signed image
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.names.outputs.image }}@${{ steps.push-signed.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign the image (keyless, by digest) and attach the SBOM as a signed attestation
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.names.outputs.image }}@${{ steps.push-signed.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$REF"

      - name: Verify the signature the way a consumer would
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ steps.names.outputs.image }}@${{ steps.push-signed.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verified for $REF"

  admission:
    # Does the cluster actually refuse what the pipeline did not sign?
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: gate
          wait: 120s

      - name: Install Kyverno (single replica, chart pinned)
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace \
            --version 3.4.6 --set admissionController.replicas=1 --wait --timeout 6m

      - name: Admission tests
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SIGNED_DIGEST: ${{ needs.build.outputs.signed_digest }}
          UNSIGNED_DIGEST: ${{ needs.build.outputs.unsigned_digest }}
          TAG_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
          REPO: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/admission-test.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get cpol -o yaml || true
          kubectl -n kyverno logs -l app.kubernetes.io/component=admission-controller --tail=200 || true
          kubectl get pods -A || true

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
